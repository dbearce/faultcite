name: Synthetic hosted restore rehearsal
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REHEARSE-synthetic-only (reuses the five exact test resources)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: synthetic-hosted-restore
  cancel-in-progress: false
jobs:
  rehearse:
    if: inputs.confirmation == 'REHEARSE-synthetic-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: restore-rehearsal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate synthetic handler locally before any remote creation
        run: node --test cloudflare/rehearsal/worker.test.mjs
      - name: Verify exact test resources and rehearse bounded restore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
          REHEARSAL_CONFIRM: ${{ inputs.confirmation }}
        run: node cloudflare/rehearsal/resume-current.mjs
      - name: Preserve synthetic-only result and resource cleanup inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: rehearsal-result.json
          retention-days: 7
          if-no-files-found: warn
