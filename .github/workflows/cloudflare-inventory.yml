name: Cloudflare inventory

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    name: Verify scoped token and list FaultCite resources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Require encrypted credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify account token and list D1 databases
        shell: bash
        run: |
          npx wrangler d1 list --json > "$RUNNER_TEMP/d1.json"
          jq -e 'type == "array"' "$RUNNER_TEMP/d1.json" > /dev/null
          jq -r '.[] | select(.name | startswith("faultcite-")) | [.name, .uuid] | @tsv' "$RUNNER_TEMP/d1.json"

      - name: List R2 buckets
        run: npx wrangler r2 bucket list

      - name: Verify Workers API access
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            > "$RUNNER_TEMP/workers.json"
          jq -e '.success == true' "$RUNNER_TEMP/workers.json" > /dev/null
          jq -r '.result[]?.id | select(startswith("faultcite-"))' "$RUNNER_TEMP/workers.json"

      - name: Inspect staging binding metadata
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/faultcite-staging/settings" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            > "$RUNNER_TEMP/staging-settings.json"
          jq -e '.success == true' "$RUNNER_TEMP/staging-settings.json" > /dev/null
          jq -r '.result.bindings[]? | [.name, .type] | @tsv' "$RUNNER_TEMP/staging-settings.json"

      - name: Inspect staging migration journal counts
        shell: bash
        run: |
          npx --no-install wrangler d1 execute DB --remote \
            --config cloudflare/wrangler.staging.toml \
            --json \
            --command "
              SELECT
                (SELECT COUNT(*) FROM d1_migrations) AS journal_rows,
                (SELECT COUNT(*) FROM d1_migrations
                  WHERE name IN (
                    '0000_hard_lethal_legion.sql',
                    '0001_parallel_captain_america.sql',
                    '0002_same_kabuki.sql',
                    '0003_curved_kinsey_walden.sql',
                    '0004_faultcite_pilot_invariants.sql'
                  )) AS expected_journal_rows,
                (SELECT COUNT(*) FROM sqlite_schema
                  WHERE type = 'table' AND name IN ('platform_admins', 'user_settings')) AS repaired_tables,
                (SELECT COUNT(*) FROM pragma_table_info('invitations')
                  WHERE name = 'expires_at') AS existing_expiry_column,
                (SELECT COUNT(*) FROM pragma_table_info('invitations')
                  WHERE name IN ('token_hash', 'revoked_at', 'delivered_at')) AS missing_invitation_columns,
                (SELECT COUNT(*) FROM sqlite_schema
                  WHERE type = 'index' AND name = 'memberships_one_active_uq') AS transient_index,
                (SELECT COUNT(*) FROM sqlite_schema
                  WHERE type = 'trigger' AND name IN (
                    'cases_machine_tenant_insert_guard',
                    'cases_machine_tenant_update_guard'
                  )) AS early_0010_triggers;
              SELECT name FROM d1_migrations ORDER BY id;
            " | jq '[.[] | .results]'

      - name: Export staging schema without customer data
        shell: bash
        run: |
          npx --no-install wrangler d1 export DB --remote \
            --config cloudflare/wrangler.staging.toml \
            --no-data \
            --output "$RUNNER_TEMP/faultcite-staging-schema.sql"
          test -s "$RUNNER_TEMP/faultcite-staging-schema.sql"
          sha256sum "$RUNNER_TEMP/faultcite-staging-schema.sql"

      - name: Upload staging schema diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: faultcite-staging-schema
          path: ${{ runner.temp }}/faultcite-staging-schema.sql
          if-no-files-found: error
          retention-days: 1

      - name: Check staging Worker health
        shell: bash
        run: |
          status="$(curl --silent --show-error --location \
            --output "$RUNNER_TEMP/staging-health.json" \
            --write-out '%{http_code}' \
            "https://staging.faultcite.com/api/health")"
          echo "staging /api/health status: $status"
          test "$status" = "200"
          jq -e '.status == "ok"' "$RUNNER_TEMP/staging-health.json" > /dev/null

      - name: Verify faultcite.com zone access
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --get \
            "https://api.cloudflare.com/client/v4/zones" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=faultcite.com" \
            --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" \
            > "$RUNNER_TEMP/zone.json"
          jq -e '.success == true and (.result | length == 1)' "$RUNNER_TEMP/zone.json" > /dev/null
          echo "faultcite.com zone access verified"
