name: Deploy Cloudflare staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: faultcite-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, deploy, and verify FaultCite staging
    if: inputs.confirmation == 'DEPLOY-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_URL: https://staging.faultcite.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Require encrypted credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Cloudflare API token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Cloudflare account ID"; exit 1; }

      - name: Verify existing staging domain belongs to the approved Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --get \
            "https://api.cloudflare.com/client/v4/zones" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=faultcite.com" \
            --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" \
            > "$RUNNER_TEMP/zone.json"
          zone_id="$(jq -er '.result | if length == 1 and .[0].status == "active" then .[0].id else empty end' "$RUNNER_TEMP/zone.json")"
          curl --fail-with-body --silent --show-error --get \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=staging.faultcite.com" \
            > "$RUNNER_TEMP/staging-dns.json"
          jq -e '.success == true' "$RUNNER_TEMP/staging-dns.json" > /dev/null
          jq -e '
            (.result | length == 1) and
            (.result[0].name == "staging.faultcite.com") and
            (.result[0].type == "AAAA") and
            (.result[0].proxied == true)
          ' "$RUNNER_TEMP/staging-dns.json" > /dev/null || {
            echo "The existing staging DNS record is not the verified Custom Domain record; refusing to deploy"
            exit 1
          }
          jq -S '[.result[] | {id, type, name, content, proxied, ttl, modified_on}]' \
            "$RUNNER_TEMP/staging-dns.json" > "$RUNNER_TEMP/staging-dns-before.json"

          curl --fail-with-body --silent --show-error --get \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "hostname=staging.faultcite.com" \
            > "$RUNNER_TEMP/staging-domains.json"
          jq -e '.success == true' "$RUNNER_TEMP/staging-domains.json" > /dev/null
          jq -e --arg zone "$zone_id" '
            (.result | length == 1) and
            (.result[0].hostname == "staging.faultcite.com") and
            (.result[0].service == "faultcite-staging") and
            (.result[0].zone_id == $zone)
          ' "$RUNNER_TEMP/staging-domains.json" > /dev/null || {
            echo "The staging domain is not bound to the approved staging Worker; refusing to deploy"
            exit 1
          }
          echo "Existing Custom Domain belongs to faultcite-staging in the approved zone."
          echo "STAGING_ZONE_ID=$zone_id" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify staging resources and prepare corrected variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          settings="$RUNNER_TEMP/staging-settings.json"
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/faultcite-staging/settings" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            > "$settings"
          jq -e '.success == true' "$settings" > /dev/null
          jq -e '
            (.result.bindings | any(.name == "CLERK_SECRET_KEY" and .type == "secret_text")) and
            (.result.bindings | any(.name == "RESEND_API_KEY" and .type == "secret_text")) and
            (.result.bindings | any(.name == "DB" and .type == "d1")) and
            (.result.bindings | any(.name == "BUCKET" and .type == "r2_bucket"))
          ' "$settings" > /dev/null

          publishable_key="$(jq -er '
            (.result.bindings | map(select(.name == "CLERK_PUBLISHABLE_KEY"))[0].text) //
            (.result.bindings | map(select(.name == "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"))[0].text)
          ' "$settings")"
          email_from="$(jq -er '
            (.result.bindings | map(select(.name == "FAULTCITE_EMAIL_FROM"))[0].text) //
            (.result.bindings | map(select(.name == "FAULTCITE_FROM_EMAIL"))[0].text)
          ' "$settings")"
          echo "::add-mask::$publishable_key"
          echo "::add-mask::$email_from"

          export STAGING_CLERK_PUBLISHABLE_KEY="$publishable_key"
          export STAGING_EMAIL_FROM="$email_from"
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const quote = (value) => JSON.stringify(value);
          appendFileSync(
            "cloudflare/wrangler.staging.toml",
            [
              "",
              `CLERK_PUBLISHABLE_KEY = ${quote(process.env.STAGING_CLERK_PUBLISHABLE_KEY)}`,
              `FAULTCITE_EMAIL_FROM = ${quote(process.env.STAGING_EMAIL_FROM)}`,
              "",
            ].join("\n"),
          );
          NODE

          grep -q 'FAULTCITE_PAID_BILLING_ENABLED = "false"' cloudflare/wrangler.staging.toml
          grep -q 'database_id = "0a9b513b-1067-4939-81b4-4fe9c01b8dd9"' cloudflare/wrangler.staging.toml
          grep -q 'bucket_name = "faultcite-staging-files"' cloudflare/wrangler.staging.toml
          grep -q '^pattern = "staging.faultcite.com"$' cloudflare/wrangler.staging.toml
          grep -q '^custom_domain = true$' cloudflare/wrangler.staging.toml
          grep -q '^FAULTCITE_APP_ORIGIN = "https://staging.faultcite.com"$' cloudflare/wrangler.staging.toml
          grep -q '^CLERK_AUTHORIZED_PARTIES = "https://staging.faultcite.com"$' cloudflare/wrangler.staging.toml

      - name: Validate build and deployment package
        shell: bash
        run: |
          npm run cf:check
          npm run build
          npm run validate:artifact
          npx --no-install wrangler deploy \
            --config cloudflare/wrangler.staging.toml \
            --dry-run --keep-vars --strict

      - name: Apply pending staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
          FAULTCITE_CONFIRM: MIGRATE-staging
        shell: bash
        run: |
          # Record a recovery bookmark before the guarded journal repair.
          npx --no-install wrangler d1 time-travel info DB \
            --config cloudflare/wrangler.staging.toml \
            --json
          bash cloudflare/scripts/repair-staging-migrations.sh
          npm run cf:migrate:staging

      - name: Deploy FaultCite 0.3.9 to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
          FAULTCITE_CONFIRM: DEPLOY-staging
        run: npm run cf:deploy:staging

      - name: Verify staging DNS was not changed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --get \
            "https://api.cloudflare.com/client/v4/zones/$STAGING_ZONE_ID/dns_records" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=staging.faultcite.com" \
            > "$RUNNER_TEMP/staging-dns-after-response.json"
          jq -e '.success == true' "$RUNNER_TEMP/staging-dns-after-response.json" > /dev/null
          jq -S '[.result[] | {id, type, name, content, proxied, ttl, modified_on}]' \
            "$RUNNER_TEMP/staging-dns-after-response.json" > "$RUNNER_TEMP/staging-dns-after.json"
          cmp "$RUNNER_TEMP/staging-dns-before.json" "$RUNNER_TEMP/staging-dns-after.json" || {
            echo "Staging DNS differs from its pre-deploy state; investigate before further deployment"
            exit 1
          }
          echo "Staging DNS record is unchanged."

      - name: Verify corrected bindings and disabled billing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
        shell: bash
        run: |
          settings="$RUNNER_TEMP/deployed-settings.json"
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/faultcite-staging/settings" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            > "$settings"
          jq -e '
            .success == true and
            (.result.bindings | any(.name == "CLERK_SECRET_KEY" and .type == "secret_text")) and
            (.result.bindings | any(.name == "RESEND_API_KEY" and .type == "secret_text")) and
            (.result.bindings | any(.name == "CLERK_PUBLISHABLE_KEY" and .type == "plain_text")) and
            (.result.bindings | any(.name == "FAULTCITE_EMAIL_FROM" and .type == "plain_text")) and
            (.result.bindings | any(.name == "FAULTCITE_APP_ORIGIN" and .text == "https://staging.faultcite.com")) and
            (.result.bindings | any(.name == "CLERK_AUTHORIZED_PARTIES" and .text == "https://staging.faultcite.com")) and
            (.result.bindings | any(
              .name == "FAULTCITE_PAID_BILLING_ENABLED" and
              .type == "plain_text" and
              .text == "false"
            )) and
            (.result.bindings | any(.name == "DB" and .type == "d1")) and
            (.result.bindings | any(.name == "BUCKET" and .type == "r2_bucket"))
          ' "$settings" > /dev/null
          echo "Corrected staging bindings verified; paid billing remains disabled."

      - name: Run staging smoke checks
        env:
          FAULTCITE_SMOKE_URL: ${{ env.STAGING_URL }}
        run: npm run cf:smoke

      - name: Verify staging sign-in origin is accepted by Clerk
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            "$STAGING_URL/sign-in" > "$RUNNER_TEMP/staging-sign-in.html"
          grep -q 'Sign in to FaultCite' "$RUNNER_TEMP/staging-sign-in.html"
          curl --silent --show-error --max-time 20 \
            --header "Origin: $STAGING_URL" \
            'https://clerk.faultcite.com/v1/client?_clerk_js_version=5.127.2' \
            > "$RUNNER_TEMP/clerk-origin.json"
          jq -e 'has("client") and ((.errors // []) | length == 0)' "$RUNNER_TEMP/clerk-origin.json" > /dev/null
          echo "Clerk accepted the staging origin; interactive sign-in still needs browser verification."

      - name: Record deployment status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deployments status --config cloudflare/wrangler.staging.toml
